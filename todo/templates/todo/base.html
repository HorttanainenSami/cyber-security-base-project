<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Todo app</title>
    <style>
        .message { padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .message.success { background: rgb(174, 255, 174); color: black; }
        .message.warning { background: rgb(255, 255, 155); color: black; }
        .message.error   { background: rgb(255, 158, 158); color: black; }
    </style>
</head>
<body style="margin: 0px;">
    <nav style="display: flex; gap: 10px; margin-bottom: 20px; background-color: #f0f0f0; padding: 10px;">
        <a href="/todo/">All todos</a>
        <a href="/todo/search/">Search</a>
        {% if user.is_authenticated and user.is_staff %}
            <a href="/todo/admin/?is_staff=true">Admin view</a>
        {% endif %}
        <div style="margin-left: auto;">
            {% if user.is_authenticated %}
                <span>Welcome, {{ user.username }}!</span>
                <a  href="/todo/accounts/logout/">logout</a>
                {% else %}
                <a href="/todo/accounts/login/">login</a>
                {% endif %}
        </div>
    </nav>
    <div style="margin: 20px;">
        {% for message in messages %}
            <p class="message {{ message.tags }}">{{ message }}</p>
        {% endfor %}
        {% block content %}
        
        {% endblock %}
    </div>
</body>
</html>
